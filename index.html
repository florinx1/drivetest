<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drive Test">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ICG Drive Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
:root{
  --top:#1F3864;
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F5F8FB; --ink:#0E1B2B; --ink-2:#4A5A6E; --ink-3:#6F7E91; --line:#D5DDE7;
  --accent:#1D5BB8; --accent-ink:#FFFFFF; --accent-soft:#E2EBFA;
  --ok:#1D8552; --ok-soft:#DFF3E8; --warn:#A96400; --warn-soft:#FCEFD8; --bad:#BD3526; --bad-soft:#FAE4E0;
  --block:#5F6C7D; --block-soft:#E4E9EF; --shadow:0 1px 2px rgba(14,27,43,.06),0 6px 20px rgba(14,27,43,.06);
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --top:#14264A; --bg:#0A131E; --surface:#122030; --surface-2:#172A3D; --ink:#E5ECF4; --ink-2:#A2B1C3; --ink-3:#8392A6; --line:#243649;
  --accent:#5E9DF2; --accent-ink:#06101C; --accent-soft:#16304F; --ok:#4DC38B; --ok-soft:#113325; --warn:#F0A93C; --warn-soft:#382810;
  --bad:#F07466; --bad-soft:#3C1916; --block:#8C99AA; --block-soft:#1F3043; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --top:#14264A; --bg:#0A131E; --surface:#122030; --surface-2:#172A3D; --ink:#E5ECF4; --ink-2:#A2B1C3; --ink-3:#8392A6; --line:#243649;
  --accent:#5E9DF2; --accent-ink:#06101C; --accent-soft:#16304F; --ok:#4DC38B; --ok-soft:#113325; --warn:#F0A93C; --warn-soft:#382810;
  --bad:#F07466; --bad-soft:#3C1916; --block:#8C99AA; --block-soft:#1F3043; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:30px} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* antet, ca în aplicațiile Foton by Inter Cargo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--top);color:#fff;padding-inline:16px}
.top-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:60px;padding-block:8px}
.top-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.top-title b{font-family:var(--f-disp);font-size:22px;letter-spacing:.03em;line-height:1}
.user-chip{align-self:flex-start;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brands{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.brands img{height:26px;width:auto;display:block}
@media (max-width:420px){.brands img{height:19px}.brands{gap:7px}.top-title b{font-size:20px}}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:13px;padding-inline:16px;padding-block:7px;text-align:center;font-weight:500}
main{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:20px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--accent)}

/* butoane */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{min-height:52px;font-size:17px;font-family:var(--f-disp);letter-spacing:.03em;text-transform:uppercase;padding-inline:22px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* stări */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-PROGRAMAT{background:var(--accent-soft);color:var(--accent)}
.s-PREDAT,.s-warn{background:var(--warn-soft);color:var(--warn)}
.s-TERMINAT,.s-LIBER{background:var(--ok-soft);color:var(--ok)}
.s-ANULAT,.s-BLOCAT,.s-INCHISA,.s-info{background:var(--block-soft);color:var(--block)}
.s-INTARZIAT,.s-bad{background:var(--bad-soft);color:var(--bad)}
.s-ACTIVA{background:var(--accent-soft);color:var(--accent)}
.alert-chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
.alert-chip.bad{background:var(--bad-soft);color:var(--bad)} .alert-chip.warn{background:var(--warn-soft);color:var(--warn)}

.today{display:flex;flex-direction:column;gap:8px}
.today-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;width:100%;flex-wrap:wrap}
.today-item b{font-family:var(--f-disp);font-size:17px;letter-spacing:.02em}

/* vehicule */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.vcard-h{padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px dashed var(--line)}
.vcard-h .brandline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vname{font-family:var(--f-disp);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em}
.fuel{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:2px 6px;color:var(--ink-2)}
.fuel.ev{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.plate{display:inline-block;font-family:var(--f-mono);font-size:12px;border:1.5px solid var(--ink);border-radius:3px;padding:1px 6px 1px 4px;background:var(--surface)}
.plate::before{content:"RO";font-size:9px;background:#1D4FA3;color:#fff;padding:1px 3px;margin-right:5px;border-radius:1px;vertical-align:1px}
.vcard-b{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.vcard-b .next{font-size:13px;color:var(--ink-2)}
.vcard-b > .btn:last-child{margin-top:auto}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:10px 12px}

/* liste */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
button.li{cursor:pointer}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface-2)}
.li .t{font-weight:700}
.li .m{font-size:13px;color:var(--ink-2);grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.empty{padding:28px;text-align:center;color:var(--ink-2)}

/* calendar flotă */
.tl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tl{border-collapse:separate;border-spacing:0;font-size:12px}
.tl th,.tl td{padding:0;border-bottom:1px solid var(--line)}
.tl thead th{font-weight:600;color:var(--ink-3);height:44px;min-width:30px;text-align:center;line-height:1.1}
.tl thead th.we{color:var(--ink-2);background:var(--surface-2)}
.tl thead th.tod{color:var(--accent)}
.tl thead th .d{display:block;font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.tl th.vh{position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;padding:0 12px;min-width:112px;font-family:var(--f-disp);font-size:16px;color:var(--ink);border-right:1px solid var(--line)}
.tl td{height:46px;min-width:30px;border-left:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.tl td.we{background:var(--surface-2)}
.tl td.tod{box-shadow:inset 2px 0 0 var(--accent)}
.tl td .bar{display:block;height:26px;margin:0 -1px;cursor:pointer}
.bar.rez{background:var(--accent)} .bar.test{background:var(--warn)} .bar.block{background:repeating-linear-gradient(135deg,var(--block) 0 5px,color-mix(in srgb,var(--block) 60%,transparent) 5px 10px);cursor:default} .bar.done{background:var(--ok);opacity:.55}
.bar.first{border-radius:5px 0 0 5px;margin-left:3px} .bar.last{border-radius:0 5px 5px 0;margin-right:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* panou */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-bar{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding-inline:16px}
.sheet-bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:54px}
.sheet-bar h2{font-size:21px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card > h3{display:flex;align-items:center;gap:10px}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* calendar programare */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h3{flex:1;text-align:center;font-size:21px}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;font-weight:700;color:var(--ink-3);padding-block:4px;letter-spacing:.05em}
.day{aspect-ratio:1/1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:15px;cursor:pointer;position:relative;padding:0}
.day.free:hover{border-color:var(--accent)}
.day.past{opacity:.35;cursor:not-allowed;background:transparent}
.day.out{visibility:hidden}
.day.tod{border-color:var(--ink);border-width:2px}
.day.occ{cursor:help}
.day.occ.rez{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.day.occ.test{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.day.occ.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.day.occ.block{background:repeating-linear-gradient(135deg,var(--block-soft) 0 6px,var(--surface) 6px 12px);color:var(--block);border-color:var(--block-soft)}
.day.occ::after{content:"";position:absolute;bottom:6px;width:16px;height:2px;border-radius:1px;background:currentColor;opacity:.7}
.day.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.day.inrange{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:transparent}
.cal-msg{font-size:13px;min-height:20px;color:var(--ink-2)}
.cal-msg.err{color:var(--bad);font-weight:600}
.summary{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.summary .big{font-family:var(--f-disp);font-size:28px;font-weight:700}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500}
.errbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600}
.infobox{background:var(--block-soft);color:var(--ink-2);border-radius:8px;padding:10px 12px;font-size:14px}

/* formulare */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:13px;font-weight:600;color:var(--ink-2)}
.fld label .req{color:var(--bad)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld.invalid input,.fld.invalid select,.fld.invalid textarea{border-color:var(--bad)}
.inline-btn{display:flex;gap:8px}.inline-btn input{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px}
.ck input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.handover{display:flex;gap:14px;align-items:center;padding:16px;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);cursor:pointer}
.handover input{width:26px;height:26px;accent-color:var(--accent);flex:none}
.handover b{font-family:var(--f-disp);font-size:20px;letter-spacing:.02em;display:block}
.handover.disabled{border-color:var(--line);background:var(--surface-2);cursor:not-allowed;opacity:.85}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.sigs{grid-template-columns:1fr}}
.sig{display:flex;flex-direction:column;gap:6px}
.sig canvas{width:100%;height:150px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.sig .row{justify-content:space-between;font-size:13px;color:var(--ink-2)}
.rating{display:flex;gap:6px}
.rating button{width:42px;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.rating button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.confirm-inline{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--bad);border-radius:10px;background:var(--bad-soft)}

/* poze */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{position:relative;border:1.5px dashed var(--line);border-radius:10px;background:var(--surface-2);aspect-ratio:4/3;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;overflow:hidden;text-align:center;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px}
.ph.req::after{content:"obligatoriu";position:absolute;top:6px;right:6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.ph.has{border-style:solid;border-color:var(--ok);padding:0}
.ph.has::after{content:"✓";top:6px;right:6px;background:var(--ok);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(10,20,34,.72);color:#fff;font-size:12px;padding:4px 6px}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph.missing{border-color:var(--bad)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumbs a{display:block;position:relative;aspect-ratio:4/3;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs span{position:absolute;left:0;right:0;bottom:0;background:rgba(10,20,34,.72);color:#fff;font-size:11px;padding:3px 6px}

/* rezultate */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-disp);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}

<script>
/* =========================================================================
   CONFIGURARE — lipește aici URL-ul Web App generat din Google Apps Script.
   Lăsat gol = mod demonstrativ (date exemplu, salvate doar pe dispozitiv).
   ========================================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyvI9YLpTHSECbFXRL3IWEWvp_x0I1sLOn33WQUROTrPLL6Ln3fGejUJG4sqZAy3ZNm/exec';
const DEMO = !API_URL;

/* ---------- utilitare ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const fmt=s=>s?String(s).split('-').reverse().join('.'):'';
const LUNI=['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
const ZILE=['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
const fmtLong=s=>{const d=parseD(s);return `${ZILE[d.getDay()]}, ${d.getDate()} ${LUNI[d.getMonth()].toLowerCase()} ${d.getFullYear()}`};
const zileTxt=n=>n===1?'1 zi':`${n} zile`;
const overlaps=(a1,a2,b1,b2)=>a1<=b2&&b1<=a2;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const num=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:n};
const nf=n=>Math.round(n).toLocaleString('ro-RO');
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const uid=p=>p+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
const randPin=()=>String(Math.floor(1000+Math.random()*9000));
function intlPhone(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='4'+d;return d}

/* ---------- constante ---------- */
const PHOTO_SLOTS=['Față','Spate','Lateral stânga','Lateral dreapta','Bord / kilometraj'];

const VEH_DOCS=[['itpExp','ITP'],['rcaExp','RCA'],['cascoExp','CASCO'],['rovinietaExp','Rovinietă']];
const BLOCKING_DOCS=['itpExp','rcaExp','rovinietaExp'];

/* ---------- logică comună (identică cu Code.gs) ---------- */
function occIntervals(db,vehId,excludeId){
  const t=today(), out=[];
  db.blocari.filter(b=>b.vehiculId===vehId).forEach(b=>out.push({s:b.dataStart,e:b.dataSfarsit,type:'block',label:b.motiv||'Indisponibil',ref:b.id}));
  db.rezervari.filter(r=>r.vehiculId===vehId&&r.id!==excludeId).forEach(r=>{
    const who=(r.client_denumire||'client necompletat')+' · '+r.agent;
    if(r.status==='PROGRAMAT') out.push({s:r.dataStart,e:r.dataSfarsit,type:'rez',label:'Programat: '+who,ref:r.id});
    else if(r.status==='PREDAT') out.push({s:r.dataStart,e:r.dataSfarsit>t?r.dataSfarsit:t,type:'test',label:'În test: '+who,ref:r.id});
    else if(r.status==='TERMINAT') out.push({s:r.dataStart,e:r.retur_data||r.dataSfarsit,type:'done',label:'Finalizat: '+who,ref:r.id});
  });
  return out;
}
function conflicts(db,vehId,s,e,excludeId){return occIntervals(db,vehId,excludeId).filter(i=>overlaps(s,e,i.s,i.e))}
/* vehiculul este încă la alt client (nereturnat) */
function stillOut(db,r){return db.rezervari.find(x=>x.vehiculId===r.vehiculId&&x.status==='PREDAT'&&x.id!==r.id)}
/* programare viitoare afectată de un test întârziat (în următoarele 7 zile) */
function lateBlocker(db,r,t){if(r.status!=='PROGRAMAT'||r.dataStart>addDays(t,7))return null;const x=stillOut(db,r);return x&&x.dataSfarsit<t&&x.dataStart<r.dataStart?x:null}
function vehAlerts(v,t,refEnd){
  const out=[];
  VEH_DOCS.forEach(([k,l])=>{ if(!v[k]) return; const d=diffDays(t,v[k]);
    if(d<0) out.push({level:'bad',key:k,text:`${l} expirat din ${fmt(v[k])}`});
    else if(d<=30) out.push({level:'warn',key:k,text:`${l} expiră în ${zileTxt(d)} (${fmt(v[k])})`});
    else if(refEnd&&v[k]<refEnd) out.push({level:'warn',key:k,text:`${l} expiră pe ${fmt(v[k])}, înainte de finalul perioadei`});
  });
  if(num(v.kmCurent)&&num(v.revizieUrmatoareKm)){const rem=num(v.revizieUrmatoareKm)-num(v.kmCurent);
    if(rem<=0) out.push({level:'bad',key:'revizie',text:`Revizie depășită cu ${nf(-rem)} km`});
    else if(rem<=1000) out.push({level:'warn',key:'revizie',text:`Revizie în ${nf(rem)} km`});}
  return out;
}
function blockingDocs(v,t){return BLOCKING_DOCS.filter(k=>v[k]&&v[k]<t).map(k=>VEH_DOCS.find(x=>x[0]===k)[1])}
function buildAlerts(db,t){
  const V=id=>db.vehicule.find(v=>v.id===id)||{denumire:id}; const out=[];
  db.rezervari.forEach(r=>{const v=V(r.vehiculId).denumire, c=r.client_denumire||'client necompletat';
    if(r.status==='PREDAT'&&r.dataSfarsit<t) out.push({level:'bad',text:`Retur întârziat ${zileTxt(diffDays(r.dataSfarsit,t))}: ${v} – ${c} (termen ${fmt(r.dataSfarsit)}, agent ${r.agent})`});
    else if(r.status==='PREDAT'&&r.dataSfarsit===t) out.push({level:'info',text:`Retur azi: ${v} – ${c} (agent ${r.agent})`});
    if(r.status==='PROGRAMAT'&&r.dataStart<=t&&r.dataSfarsit>=t) out.push({level:'info',text:`Predare azi: ${v} – ${c} (agent ${r.agent})`});
    if(r.status==='PROGRAMAT'&&!r.client_denumire&&r.dataStart>=t&&diffDays(t,r.dataStart)<=2) out.push({level:'warn',text:`Programare fără date client: ${v}, ${fmt(r.dataStart)} (agent ${r.agent})`});
    const lb=lateBlocker(db,r,t); if(lb) out.push({level:'bad',text:`Programare afectată de întârziere: ${v} – ${c}, din ${fmt(r.dataStart)} (agent ${r.agent}). Vehiculul nu a fost returnat de ${lb.client_denumire||'clientul anterior'} (termen ${fmt(lb.dataSfarsit)}, agent ${lb.agent}).`});
    if(r.status==='PROGRAMAT'&&r.dataSfarsit<t) out.push({level:'warn',text:`Programare nepredată și expirată: ${v} – ${c}, ${fmt(r.dataStart)}–${fmt(r.dataSfarsit)}. Anuleaz-o pentru a elibera istoricul.`});
  });
  db.vehicule.filter(v=>v.activ!=='Nu').forEach(v=>vehAlerts(v,t).forEach(a=>out.push({level:a.level,text:`${v.denumire}: ${a.text}`})));
  (db.asteptare||[]).filter(a=>a.status==='LIBER').forEach(a=>out.push({level:'info',text:`Listă de așteptare: ${V(a.vehiculId).denumire} e liber ${fmt(a.dataStart)}–${fmt(a.dataSfarsit)} pentru ${a.client||'client'} (agent ${a.agent})`}));
  const ord={bad:0,warn:1,info:2}; return out.sort((a,b)=>ord[a.level]-ord[b.level]);
}
function checkWaitlist(db,vehId,t){
  const freed=[];
  (db.asteptare||[]).filter(a=>a.status==='ACTIVA'&&(!vehId||a.vehiculId===vehId)).forEach(a=>{
    if(a.dataSfarsit<t){a.status='INCHISA';return}
    const s=a.dataStart<t?t:a.dataStart;
    if(!conflicts(db,a.vehiculId,s,a.dataSfarsit).length){a.status='LIBER';a.notificatLa=t;freed.push(a)}
  });
  return freed;
}

/* Handler local — oglinda acțiunilor din Code.gs */
const PUBLIC_ACTIONS=['getUsers','login'];
const ADMIN_ACTIONS=['saveBlocare','deleteBlocare','saveUtilizator','deleteUtilizator','saveVehicul','saveSetari','testAlerte'];
function localHandle(action,p,auth){
  const db=DEMO_DB, t=today();
  let me=null;
  if(!PUBLIC_ACTIONS.includes(action)){
    me=db.utilizatori.find(u=>u.activ!=='Nu'&&u.nume===(auth&&auth.user));
    if(!me||String(me.pin)!==String(auth.pin)) throw new Error('AUTH: Sesiunea a expirat sau PIN-ul a fost schimbat. Autentifică-te din nou.');
    if(ADMIN_ACTIONS.includes(action)&&me.rol!=='admin') throw new Error('Doar administratorii pot face această operațiune.');
  }
  const pub=()=>({vehicule:db.vehicule,utilizatori:db.utilizatori.map(({pin,...u})=>u),rezervari:db.rezervari,blocari:db.blocari,asteptare:db.asteptare,
    fotografii:db.fotografii.map(f=>({id:f.id,rezervareId:f.rezervareId,etapa:f.etapa,slot:f.slot,url:'',thumb:f.data})),setari:Object.assign({},db.setari)});
  const findR=id=>{const r=db.rezervari.find(x=>x.id===id);if(!r)throw new Error('Programarea nu mai există.');return r};
  const V=id=>db.vehicule.find(v=>v.id===id);
  const saveFotos=(r,etapa,list)=>(list||[]).forEach(f=>db.fotografii.push({id:uid('F'),rezervareId:r.id,etapa,slot:f.slot,data:f.data,creatLa:t}));
  const notifyWait=vehId=>checkWaitlist(db,vehId,t).forEach(a=>db.outbox.push({to:a.agent,subject:'Vehicul liber pentru lista de așteptare',t}));
  switch(action){
    case 'getUsers': return db.utilizatori.filter(u=>u.activ!=='Nu').map(u=>u.nume);
    case 'login':{const u=db.utilizatori.find(x=>x.activ!=='Nu'&&x.nume===p.user);if(!u||String(u.pin)!==String(p.pin))throw new Error('Nume sau PIN greșit.');return {user:u.nume,rol:u.rol}}
    case 'getAll': checkWaitlist(db,null,t); return Object.assign(pub(),{me:{nume:me.nume,rol:me.rol}});
    case 'changePin':{if(!/^\d{4,8}$/.test(p.pin||''))throw new Error('PIN-ul trebuie să aibă 4–8 cifre.');me.pin=p.pin;return true}
    case 'createRezervare':{
      if(!p.vehiculId||!p.dataStart||!p.dataSfarsit) throw new Error('Alege vehiculul și perioada.');
      if(p.dataStart<t) throw new Error('Nu se poate programa în trecut.');
      if(p.dataSfarsit<p.dataStart) throw new Error('Data de final este înaintea datei de început.');
      const c=conflicts(db,p.vehiculId,p.dataStart,p.dataSfarsit);
      if(c.length) throw new Error('Perioada se suprapune cu: '+c[0].label+' ('+fmt(c[0].s)+' – '+fmt(c[0].e)+').');
      const r={id:uid('R'),vehiculId:p.vehiculId,dataStart:p.dataStart,dataSfarsit:p.dataSfarsit,agent:me.nume,status:'PROGRAMAT',creatLa:t};
      if(p.asteptareId){const a=db.asteptare.find(x=>x.id===p.asteptareId);if(a){a.status='INCHISA';r.client_denumire=a.client||''}}
      db.rezervari.push(r); return Object.assign(pub(),{newId:r.id});
    }
    case 'saveClient':{const r=findR(p.id);if(r.status!=='PROGRAMAT')throw new Error('Datele clientului se pot modifica doar înainte de predare.');
      Object.keys(p.fields).filter(k=>k.startsWith('client_')).forEach(k=>r[k]=p.fields[k]);return pub();}
    case 'predare':{const r=findR(p.id), v=V(r.vehiculId);
      if(r.status!=='PROGRAMAT') throw new Error('Vehiculul a fost deja predat sau programarea este închisă.');
      if(t<r.dataStart) throw new Error('Predarea se confirmă începând cu ziua programării ('+fmt(r.dataStart)+').');
      const bd=blockingDocs(v,t); if(bd.length) throw new Error('Vehiculul nu poate fi predat: '+bd.join(', ')+' expirat. Actualizează documentele în Admin → Vehicule.');
      if((p.fields||{}).predare_informareGDPR!=='Da') throw new Error('Confirmă că clientul a primit Nota de informare privind prelucrarea datelor.');
      const so=stillOut(db,r); if(so) throw new Error(`Vehiculul nu a fost returnat de clientul anterior (${so.client_denumire||'—'}, agent ${so.agent}, termen ${fmt(so.dataSfarsit)}). Predarea se poate face după confirmarea returului.`);
      if((p.fotos||[]).filter(f=>PHOTO_SLOTS.includes(f.slot)).length<PHOTO_SLOTS.length) throw new Error('Lipsesc pozele obligatorii.');
      Object.keys(p.fields).filter(k=>/^(sofer|sofer2|predare)_/.test(k)).forEach(k=>r[k]=p.fields[k]);
      const n=parseInt(db.setari.contract_next||'1',10);
      r.nrContract=(db.setari.contract_prefix||'DT')+'-'+t.slice(0,4)+'-'+String(n).padStart(3,'0');
      db.setari.contract_next=String(n+1); r.status='PREDAT';
      if(num(r.predare_km)>num(v.kmCurent)) v.kmCurent=r.predare_km;
      Object.entries(p.semnaturi||{}).forEach(([tip,img])=>{if(img)db.semnaturi.push({rezervareId:r.id,tip,imagine:img,creatLa:t})});
      saveFotos(r,'predare',p.fotos);
      return pub();}
    case 'prelungire':{const r=findR(p.id);
      if(!['PROGRAMAT','PREDAT'].includes(r.status)) throw new Error('Programarea este închisă.');
      if(!p.dataSfarsit||p.dataSfarsit<r.dataStart) throw new Error('Data nouă este înaintea începutului.');
      const c=conflicts(db,r.vehiculId,r.dataStart,p.dataSfarsit,r.id);
      if(c.length) throw new Error('Nu se poate prelungi: urmează '+c[0].label+' din '+fmt(c[0].s)+'.');
      r.dataSfarsit=p.dataSfarsit; notifyWait(r.vehiculId); return pub();}
    case 'retur':{const r=findR(p.id), v=V(r.vehiculId);if(r.status!=='PREDAT')throw new Error('Vehiculul nu figurează ca predat.');
      if((p.fotos||[]).filter(f=>PHOTO_SLOTS.includes(f.slot)).length<PHOTO_SLOTS.length) throw new Error('Lipsesc pozele obligatorii.');
      Object.keys(p.fields).filter(k=>k.startsWith('retur_')).forEach(k=>r[k]=p.fields[k]);r.status='TERMINAT';r.rezultat=r.rezultat||'În lucru';
      if(num(r.retur_km)>num(v.kmCurent)) v.kmCurent=r.retur_km;
      Object.entries(p.semnaturi||{}).forEach(([tip,img])=>{if(img)db.semnaturi.push({rezervareId:r.id,tip,imagine:img,creatLa:t})});
      saveFotos(r,'retur',p.fotos); notifyWait(r.vehiculId);
      return pub();}
    case 'anulare':{const r=findR(p.id);if(r.status!=='PROGRAMAT')throw new Error('Doar programările nepredate pot fi anulate.');
      r.status='ANULAT';r.anulatMotiv=p.motiv||'';r.anulatDe=me.nume;notifyWait(r.vehiculId);return pub();}
    case 'getDocData': return {semnaturi:db.semnaturi.filter(s=>s.rezervareId===p.id),fotos:db.fotografii.filter(f=>f.rezervareId===p.id).map(f=>({etapa:f.etapa,slot:f.slot,data:f.data}))};
    case 'savePdf':{const r=findR(p.id);const k=p.kind==='pv'?'pv_pdf':'contract_pdf';r[k]='demo';
      const to=p.email&&r.client_email?r.client_email:'';if(to){r[p.kind==='pv'?'pv_email':'contract_email']=to;db.outbox.push({to,subject:p.filename,t})}
      return Object.assign(pub(),{saved:{url:'',emailed:to,demo:true}});}
    case 'saveRezultat':{const r=findR(p.id);['rezultat','rezultat_unitati','rezultat_obs'].forEach(k=>{if(k in p)r[k]=p[k]});return pub();}
    case 'addAsteptare':{
      if(!p.vehiculId||!p.dataStart||!p.dataSfarsit||p.dataSfarsit<p.dataStart) throw new Error('Alege o perioadă validă.');
      if(p.dataSfarsit<t) throw new Error('Perioada este în trecut.');
      if(!conflicts(db,p.vehiculId,p.dataStart<t?t:p.dataStart,p.dataSfarsit).length) throw new Error('Vehiculul este liber în această perioadă. Programează-l direct.');
      db.asteptare.push({id:uid('A'),vehiculId:p.vehiculId,dataStart:p.dataStart,dataSfarsit:p.dataSfarsit,agent:me.nume,client:p.client||'',obs:p.obs||'',status:'ACTIVA',creatLa:t});return pub();}
    case 'deleteAsteptare':{const a=db.asteptare.find(x=>x.id===p.id);if(a){if(a.agent!==me.nume&&me.rol!=='admin')throw new Error('Poți șterge doar cererile tale.');a.status='INCHISA'}return pub();}
    case 'anaf': throw new Error('Căutarea după CUI în baza ANAF funcționează după conectarea aplicației la Google Apps Script.');
    case 'saveBlocare':{
      if(!p.dataStart||!p.dataSfarsit||p.dataSfarsit<p.dataStart) throw new Error('Perioadă invalidă.');
      (p.vehiculIds||[]).forEach(v=>db.blocari.push({id:uid('B'),vehiculId:v,dataStart:p.dataStart,dataSfarsit:p.dataSfarsit,motiv:p.motiv||'',creatDe:me.nume,creatLa:t}));
      return pub();}
    case 'deleteBlocare':{const b=db.blocari.find(x=>x.id===p.id);db.blocari=db.blocari.filter(x=>x.id!==p.id);if(b)notifyWait(b.vehiculId);return pub();}
    case 'saveUtilizator':{
      if(!p.nume) throw new Error('Completează numele.');
      if(p.pin&&!/^\d{4,8}$/.test(p.pin)) throw new Error('PIN-ul trebuie să aibă 4–8 cifre.');
      let u=p.id&&db.utilizatori.find(x=>x.id===p.id);
      if(u){['nume','telefon','email','rol'].forEach(k=>{if(k in p)u[k]=p[k]});if(p.pin)u.pin=p.pin;u.activ='Da'}
      else{if(!p.pin)throw new Error('Setează un PIN pentru utilizatorul nou.');if(db.utilizatori.some(x=>x.activ!=='Nu'&&x.nume===p.nume))throw new Error('Există deja un utilizator cu acest nume.');
        db.utilizatori.push({id:uid('U'),nume:p.nume,telefon:p.telefon||'',email:p.email||'',rol:p.rol||'agent',activ:'Da',pin:p.pin})}
      return pub();}
    case 'deleteUtilizator':{const u=db.utilizatori.find(x=>x.id===p.id);if(u&&u.nume===me.nume)throw new Error('Nu îți poți dezactiva propriul cont.');if(u)u.activ='Nu';return pub();}
    case 'saveVehicul':{const v=V(p.id);if(!v)throw new Error('Vehicul inexistent.');Object.assign(v,p);return pub();}
    case 'saveSetari':{Object.keys(p).forEach(k=>db.setari[k]=p[k]);return pub();}
    case 'testAlerte':{const a=buildAlerts(db,t);return {sent:false,to:db.setari.email_alerte||'',count:a.length,demo:true}}
  }
  throw new Error('Acțiune necunoscută: '+action);
}

/* ---------- API ---------- */
async function api(action,payload={},opt={}){
  if(!opt.quiet){$('#loaderTxt').textContent=opt.msg||'';$('#loader').hidden=false;}
  try{
    if(DEMO){await sleep(150);const r=localHandle(action,payload,S.auth);demoSave();return JSON.parse(JSON.stringify(r));}
    const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action,payload,auth:S.auth})});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'Eroare de server.');
    return j.data;
  }catch(e){
    if(String(e.message).startsWith('AUTH:')){logout();throw new Error(e.message.slice(5).trim())}
    if(e instanceof TypeError) throw new Error('Nu există conexiune la server. Verifică internetul și încearcă din nou.');
    throw e;
  }finally{ if(!opt.quiet) $('#loader').hidden=true; }
}

function vehNow(v){
  const t=today(), rs=S.db.rezervari.filter(r=>r.vehiculId===v.id);
  const inTest=rs.find(r=>r.status==='PREDAT');
  if(inTest) return {k:t>inTest.dataSfarsit?'INTARZIAT':'PREDAT',l:t>inTest.dataSfarsit?'Retur întârziat':'În test',d:`${esc(inTest.client_denumire||'—')} · retur ${fmt(inTest.dataSfarsit)}`,r:inTest};
  const bl=S.db.blocari.find(b=>b.vehiculId===v.id&&overlaps(t,t,b.dataStart,b.dataSfarsit));
  if(bl) return {k:'BLOCAT',l:'Indisponibil',d:`${esc(bl.motiv||'Ocupat')} · până la ${fmt(bl.dataSfarsit)}`};
  const azi=rs.find(r=>r.status==='PROGRAMAT'&&overlaps(t,t,r.dataStart,r.dataSfarsit));
  if(azi) return {k:'PROGRAMAT',l:'Predare azi',d:esc(azi.client_denumire||'client necompletat'),r:azi};
  return {k:'LIBER',l:'Disponibil azi',d:''};
}
function homeView(){

  const ret=S.db.rezervari.filter(r=>r.status==='PREDAT'&&r.dataSfarsit<=t);
  const wait=(S.db.asteptare||[]).filter(a=>a.status==='LIBER'&&a.agent===me);

/* ---------- calendar flotă ---------- */
function calendarView(){
  const t=today(); const d0=parseD(t); const dow=(d0.getDay()+6)%7; const start=addDays(t,-dow); const N=42;
  const days=[...Array(N)].map((_,i)=>addDays(start,i));
  const head=days.map(d=>{const x=parseD(d),we=x.getDay()%6===0;return `<th class="${we?'we':''} ${d===t?'tod':''}">${['D','L','Ma','Mi','J','V','S'][x.getDay()]}<span class="d">${x.getDate()}</span></th>`}).join('');
  const rows=vehs().map(v=>{
    const iv=occIntervals(S.db,v.id);
    return `<tr><th class="vh">${esc(v.denumire)}</th>${days.map(d=>{
      const x=parseD(d),we=x.getDay()%6===0; const i=iv.find(i=>d>=i.s&&d<=i.e);
      let bar='';
      if(i){const first=d===i.s||d===start,last=d===i.e;bar=`<span class="bar ${i.type} ${first?'first':''} ${last?'last':''}" title="${esc(i.label)} (${fmt(i.s)} – ${fmt(i.e)})" ${i.type==='block'?'':`data-open="${i.ref}"`}></span>`}
      return `<td class="${we?'we':''} ${d===t?'tod':''}">${bar}</td>`}).join('')}</tr>`}).join('');
  const m1=parseD(start),m2=parseD(days[N-1]);
  return `<section class="row"><div><p class="eyebrow">Următoarele 6 săptămâni</p><h1>Calendar flotă</h1></div><span class="spacer"></span><span class="small muted mono">${fmt(start)} – ${fmt(days[N-1])}</span></section>
  <div class="legend"><span><i style="background:var(--accent)"></i>Programat</span><span><i style="background:var(--warn)"></i>În test</span><span><i style="background:var(--ok);opacity:.55"></i>Finalizat</span><span><i style="background:repeating-linear-gradient(135deg,var(--block) 0 3px,transparent 3px 6px)"></i>Ocupat (blocat de admin)</span></div>
  <div class="tl-wrap"><table class="tl"><thead><tr><th class="vh" style="font-size:13px;color:var(--ink-3)">${LUNI[m1.getMonth()].slice(0,3)}.${m1.getMonth()!==m2.getMonth()?' – '+LUNI[m2.getMonth()].slice(0,3)+'.':''}</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
  <p class="small muted">Atinge o bară colorată pentru detaliile programării. Pentru a rezerva, folosește „Programează drive test” de la fiecare vehicul.</p>
  <p class="note">${recNote()}</p>`;
}

/* ---------- rezultate ---------- */
function resultsView(){
  const t=today(), from=S.period==='all'?'0000-00-00':addDays(t,-(+S.period));
  const days=S.period==='all'?Math.max(1,diffDays(S.db.rezervari.reduce((m,r)=>r.dataStart<m?r.dataStart:m,t),t)+1):+S.period;
  const R=S.db.rezervari.filter(r=>r.status!=='ANULAT'&&r.dataStart>=from);
  const fin=R.filter(r=>r.status==='TERMINAT');
  const km=r=>Math.max(0,num(r.retur_km)-num(r.predare_km));
  const used=r=>{if(r.status==='PREDAT')return diffDays(r.dataStart<from?from:r.dataStart,t)+1;if(r.status==='TERMINAT')return diffDays(r.dataStart<from?from:r.dataStart,r.retur_data||r.dataSfarsit)+1;return 0};
  const sold=fin.filter(r=>r.rezultat==='Vândut'), lost=fin.filter(r=>r.rezultat==='Pierdut'), offer=fin.filter(r=>r.rezultat==='Ofertă trimisă');
  const closed=sold.length+lost.length;
  const units=sold.reduce((s,r)=>s+(num(r.rezultat_unitati)||1),0);
  const interest=fin.filter(r=>num(r.retur_interes)); const avgI=interest.length?interest.reduce((s,r)=>s+num(r.retur_interes),0)/interest.length:0;
  const chip=(k,l)=>`<button class="chip" data-period="${k}" aria-pressed="${S.period===k}">${l}</button>`;
  const kpi=(v,l)=>`<div class="kpi"><span class="v">${v}</span><span class="l">${l}</span></div>`;
  const vrows=vehs().map(v=>{const rs=R.filter(r=>r.vehiculId===v.id);const f=rs.filter(r=>r.status==='TERMINAT');const u=rs.reduce((s,r)=>s+used(r),0);const pct=Math.min(100,Math.round(u/days*100));
    const iv=f.filter(r=>num(r.retur_interes));return {v,n:rs.length,f:f.length,km:f.reduce((s,r)=>s+km(r),0),u,pct,i:iv.length?(iv.reduce((s,r)=>s+num(r.retur_interes),0)/iv.length).toFixed(1):'—',sold:f.filter(r=>r.rezultat==='Vândut').length}});
  const agents=[...new Set(R.map(r=>r.agent))].map(a=>{const rs=R.filter(r=>r.agent===a),f=rs.filter(r=>r.status==='TERMINAT');return {a,n:rs.length,f:f.length,o:f.filter(r=>r.rezultat==='Ofertă trimisă').length,s:f.filter(r=>r.rezultat==='Vândut').length,u:f.filter(r=>r.rezultat==='Vândut').reduce((s,r)=>s+(num(r.rezultat_unitati)||1),0)}}).sort((x,y)=>y.s-x.s||y.f-x.f);
  const intents=['Cumpără în curând','Evaluează oferta','Necesită alt model','Nu este interesat'].map(k=>({k,n:fin.filter(r=>r.retur_intentie===k).length}));
  const maxI=Math.max(1,...intents.map(x=>x.n));
  const outs=REZULTATE.map(k=>({k,n:fin.filter(r=>(r.rezultat||'În lucru')===k).length})); const maxO=Math.max(1,...outs.map(x=>x.n));
  const hb=(list,max)=>`<div class="hbars">${list.map(x=>`<div class="hbar" title="${esc(x.k)}: ${x.n}"><span>${esc(x.k)}</span><span class="track"><span class="fill" style="width:${x.n/max*100}%"></span></span><span class="n">${x.n}</span></div>`).join('')}</div>`;
  return `<section><p class="eyebrow">Performanța flotei demo</p><h1>Rezultate</h1></section>
  <div class="filters">${chip('30','30 zile')}${chip('90','90 zile')}${chip('365','12 luni')}${chip('all','Tot')}</div>
  <div class="kpis">${kpi(fin.length,'drive test-uri finalizate')}${kpi(R.filter(r=>r.status!=='TERMINAT').length,'programate sau în test')}${kpi(nf(fin.reduce((s,r)=>s+km(r),0)),'km parcurși de clienți')}${kpi(closed?Math.round(sold.length/closed*100)+'%':'—','rată de câștig (vândut / închise)')}${kpi(units,'unități vândute după test')}${kpi(avgI?avgI.toFixed(1):'—','interes mediu (1–5)')}</div>
  <div class="card"><h3>Pe vehicul</h3><p class="small muted">Gradul de utilizare = zile la clienți din ${days} zile ale perioadei.</p>
    <div class="tbl-wrap" style="border:0"><table class="tbl"><thead><tr><th>Vehicul</th><th class="n">Teste</th><th class="n">Finalizate</th><th class="n">Km</th><th>Utilizare</th><th class="n">Interes</th><th class="n">Vândute</th></tr></thead><tbody>
    ${vrows.map(x=>`<tr><td><b>${esc(x.v.denumire)}</b></td><td class="n">${x.n}</td><td class="n">${x.f}</td><td class="n">${nf(x.km)}</td><td><span class="meter" title="${x.u} zile din ${days}"><span class="track"><span class="fill" style="width:${x.pct}%"></span></span><span class="mono small">${x.pct}%</span></span></td><td class="n">${x.i}</td><td class="n">${x.sold}</td></tr>`).join('')}</tbody></table></div></div>

    ${agents.length?agents.map(x=>`<tr><td><b>${esc(x.a)}</b></td><td class="n">${x.n}</td><td class="n">${x.f}</td><td class="n">${x.o}</td><td class="n">${x.s}</td><td class="n">${x.u}</td></tr>`).join(''):'<tr><td colspan="6" class="muted">Nicio programare în perioadă.</td></tr>'}</tbody></table></div></div>

  <div class="card"><h3>Intenția declarată la retur</h3>${hb(intents,maxI)}</div>`;
}

const CAL_HINT='Atinge ziua de început, apoi ziua de returnare. Pentru o singură zi, atinge aceeași zi de două ori.';
function drawCal(){
  const c=S.cal, t=today(), iv=occIntervals(S.db,c.veh);
  const first=new Date(c.y,c.m,1), off=(first.getDay()+6)%7, dim=new Date(c.y,c.m+1,0).getDate();
  const now=new Date(); $('#calPrev').disabled=(c.y<now.getFullYear()||(c.y===now.getFullYear()&&c.m<=now.getMonth()));
  $('#calTitle').textContent=LUNI[c.m]+' '+c.y;
  let h=['L','Ma','Mi','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<off;i++) h+='<div class="day out"></div>';
  const end=c.end||c.start;
  for(let d=1;d<=dim;d++){
    const ds=`${c.y}-${pad(c.m+1)}-${pad(d)}`; const o=iv.find(i=>ds>=i.s&&ds<=i.e);
    let cls='day';
    if(ds<t) cls+=' past'; else if(o) cls+=' occ '+o.type; else cls+=' free';
    if(ds===t) cls+=' tod';
    if(c.start&&(ds===c.start||ds===end)) cls+=' sel'; else if(c.start&&ds>c.start&&ds<end) cls+=' inrange';
    h+=`<button class="${cls}" data-d="${ds}" ${ds<t?'disabled':''} aria-label="${fmtLong(ds)}${o?' – ocupat':''}">${d}</button>`;
  }
  $('#calGrid').innerHTML=h;
  $$('#calGrid [data-d]').forEach(b=>b.onclick=()=>pickDay(b.dataset.d));
  const msg=$('#calMsg'); msg.textContent=c.msg||CAL_HINT; msg.className='cal-msg'+(c.err?' err':'');
  drawSummary();
}
function pickDay(ds){
  const c=S.cal; const o=occIntervals(S.db,c.veh).find(i=>ds>=i.s&&ds<=i.e);
  if(o){c.msg=`${fmt(ds)} este ocupată: ${o.label} (${fmt(o.s)} – ${fmt(o.e)}).`;c.err=true;drawCal();return}
  if(!c.start||c.end){c.start=ds;c.end=null;c.msg=`Început: ${fmtLong(ds)}. Atinge acum ziua de returnare.`;c.err=false}
  else if(ds<c.start){c.start=ds;c.msg=`Început mutat pe ${fmtLong(ds)}. Atinge ziua de returnare.`;c.err=false}
  else{
    const cf=conflicts(S.db,c.veh,c.start,ds);
    if(cf.length){c.msg=`Perioada trece peste o zi ocupată (${fmt(cf[0].s)} – ${fmt(cf[0].e)}: ${cf[0].label}). Alege o perioadă mai scurtă sau intră pe lista de așteptare.`;c.err=true}
    else{c.end=ds;c.msg='Perioadă selectată. Verifică rezumatul și confirmă.';c.err=false}
  }
  drawCal();
}
function drawSummary(){

/* ---------- formulare ---------- */
function fld(k,label,val,o={}){
  const req=o.req?' <span class="req">*</span>':'';
  const id='f_'+k;
  let input;
  if(o.type==='textarea') input=`<textarea id="${id}" data-k="${k}" ${o.req?'required':''} placeholder="${esc(o.ph||'')}">${esc(val)}</textarea>`;
  else if(o.type==='select') input=`<select id="${id}" data-k="${k}" ${o.req?'required':''}>${o.opts.map(x=>`<option ${String(x)===String(val)?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else input=`<input id="${id}" data-k="${k}" type="${o.type||'text'}" value="${esc(val)}" ${o.req?'required':''} placeholder="${esc(o.ph||'')}" ${o.attrs||''}>`;
  if(o.btn) input=`<div class="inline-btn">${input}${o.btn}</div>`;
  return `<div class="fld ${o.full?'full':''}"><label for="${id}">${label}${req}</label>${input}</div>`;
}
function collect(root){
  const o={}; let bad=null;
  $$('[data-k]',root).forEach(el=>{
    const v=el.type==='checkbox'?(el.checked?'Da':'Nu'):el.value.trim(); o[el.dataset.k]=v;
    const f=el.closest('.fld'); if(f) f.classList.toggle('invalid',el.required&&!v);
    if(el.required&&!v&&!bad) bad=el;
  });
  if(bad){bad.focus();throw new Error('Completează câmpurile obligatorii marcate cu *.')}
  return o;
}
function collectLoose(root){const o={};$$('[data-k]',root).forEach(el=>o[el.dataset.k]=el.value);return o}

/* ---------- semnătură ---------- */
function sigPad(canvas){
  const ctx=canvas.getContext('2d'); let drawing=false,dirty=false;
  const r=canvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(1,r.width*dpr); canvas.height=Math.max(1,r.height*dpr); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0B1F44';
  const pos=e=>{const b=canvas.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}};
  canvas.addEventListener('pointerdown',e=>{drawing=true;dirty=true;try{canvas.setPointerCapture(e.pointerId)}catch(_){};const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke()});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>canvas.addEventListener(ev,()=>drawing=false));
  return {clear(){ctx.clearRect(0,0,canvas.width,canvas.height);dirty=false},empty:()=>!dirty,
    data(){const c=document.createElement('canvas');c.width=420;c.height=150;const x=c.getContext('2d');x.drawImage(canvas,0,0,420,150);return c.toDataURL('image/png')}};
}
function sigBlock(id,label){return `<div class="sig"><div class="row"><b>${label}</b><button type="button" class="btn ghost sm" data-clear="${id}">Șterge</button></div><canvas id="${id}"></canvas><span class="small muted">Semnează cu degetul în chenar.</span></div>`}

/* ---------- poze ---------- */
async function compressImg(file){
  const max=DEMO?1000:1600, q=DEMO?0.62:0.72;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Fișierul ales nu este o imagine.'));i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',q);
  }finally{URL.revokeObjectURL(url)}
}

  return `<div class="card"><h3>Poze ${etapa}</h3><p class="small muted">Fotografiază vehiculul din cele ${PHOTO_SLOTS.length} unghiuri. Pozele se salvează în Drive și intră în anexa foto a documentului.</p>

}
function bindPhotos(prefix){
  const store={}; const extra=[];
  $$(`#${prefix}Grid input`).forEach(inp=>inp.onchange=async()=>{
    const files=[...inp.files]; if(!files.length) return;
    try{
      if(inp.dataset.ph==='extra'){
        for(const f of files.slice(0,6)){ if(extra.length>=6){toast('Maximum 6 poze suplimentare.',1);break} extra.push(await compressImg(f)); }
        const lab=inp.closest('.ph'); lab.classList.add('has'); lab.querySelector('svg').outerHTML; lab.lastChild.textContent=`Poze suplimentare (${extra.length})`;
      } else {
        const i=+inp.dataset.ph, d=await compressImg(files[0]); store[PHOTO_SLOTS[i]]=d;
        const lab=inp.closest('.ph'); lab.classList.add('has'); lab.classList.remove('missing');
        lab.innerHTML=`<img src="${d}" alt=""><span class="cap">${esc(PHOTO_SLOTS[i])} · atinge pentru a reface</span>`; lab.appendChild(inp);
      }
    }catch(e){toast(e.message,1)}
  });
  return {
    missing(){const m=PHOTO_SLOTS.filter(s=>!store[s]);$$(`#${prefix}Grid .ph.req`).forEach(l=>l.classList.toggle('missing',!store[l.dataset.slot]));return m},
    list(){return PHOTO_SLOTS.filter(s=>store[s]).map(s=>({slot:s,data:store[s]})).concat(extra.map((d,i)=>({slot:'Suplimentar '+(i+1),data:d})))}
  };
}

      ${pf?'':fld('predare_calitateSemnatar','Calitatea semnatarului',r.client_functie||'Reprezentant legal',{full:1,ph:'ex. Administrator / Delegat cu împuternicire'})}
    </div>
      <label class="ck"><input type="checkbox" id="hAccept"><span>Clientul a citit contractul de comodat și acceptă în mod expres clauzele privind răspunderea, interdicțiile, penalitățile și soluționarea litigiilor.</span></label>

      if(!$('#hAccept').checked) throw new Error('Clientul trebuie să accepte clauzele contractului (bifa de acceptare).');
      if(pads.sigC.empty()||pads.sigI.empty()) throw new Error('Sunt necesare ambele semnături.');
      f.predare_acceptClauze='Da';
      applyDb(await api('predare',{id,fields:f,semnaturi:{predare_client:pads.sigC.data(),predare_icg:pads.sigI.data()},fotos:ph.list()},{msg:'Se salvează predarea și pozele…'}));

}

/* ---------- retur ---------- */

  const r=S.db.rezervari.find(x=>x.id===id), v=veh(r.vehiculId), t=today();
  const early=t<r.dataSfarsit, late=t>r.dataSfarsit;
  openSheet('Drive test terminat · '+esc(v.denumire),`
    ${early?`<div class="okbox">Retur mai devreme cu ${zileTxt(diffDays(t,r.dataSfarsit))}. Zilele rămase devin automat libere în calendar.</div>`:late?`<div class="errbox">Retur cu ${zileTxt(diffDays(r.dataSfarsit,t))} întârziere față de ${fmt(r.dataSfarsit)}.</div>`:''}
    <div class="card"><h3>Starea la restituire</h3><div class="fgrid" id="rf1">
      ${fld('retur_data','Data returului',t,{type:'date',req:1,attrs:`max="${t}" min="${r.dataStart}"`})}
      ${fld('retur_ora','Ora returului',nowHM(),{type:'time',req:1})}
      ${fld('retur_km',`Kilometraj la retur (la predare: ${esc(r.predare_km||'—')} km)`,'',{type:'number',req:1,attrs:`inputmode="numeric" min="${esc(r.predare_km||0)}"`})}
      ${fld('retur_nivel',isEV(v)?'Nivel baterie':'Nivel combustibil',r.predare_nivel,{type:'select',opts:nivelOpts(v),req:1})}
      ${fld('retur_daune','Daune noi constatate?','Nu',{type:'select',opts:['Nu','Da']})}
      ${fld('retur_dotari','Dotări și documente complete?','Da',{type:'select',opts:['Da','Nu']})}
      ${fld('retur_curatenie','Stare de curățenie','Corespunzătoare',{type:'select',opts:['Corespunzătoare','Necesită curățare']})}
      ${fld('retur_primitDe','Primit de (Inter Cargo)',S.me.nume,{req:1})}
      ${fld('retur_dauneDesc','Descriere daune / lipsuri',r.retur_dauneDesc,{type:'textarea',full:1,ph:'Completează doar dacă există daune noi sau lipsuri'})}
    </div></div>
    ${photoBlock('rp','la retur')}
    <div class="card"><h3>Feedback client</h3>
      <div class="fld"><label>Nivel de interes pentru achiziție</label><div class="rating" id="rRate">${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${n}" aria-pressed="false">${n}</button>`).join('')}</div></div>
      <div class="fgrid" id="rf2">
        ${fld('retur_intentie','Intenție de achiziție','Evaluează oferta',{type:'select',opts:['Cumpără în curând','Evaluează oferta','Necesită alt model','Nu este interesat']})}
        ${fld('retur_pasUrmator','Pasul următor',r.retur_pasUrmator,{ph:'ex. ofertă 2 unități până vineri'})}

      </div></div>
    <div class="card"><h3>Semnături proces-verbal de restituire</h3>
      <label class="ck"><input type="checkbox" id="rMail" ${r.client_email?'checked':'disabled'}><span>${r.client_email?`Trimite procesul-verbal PDF pe e-mail la <b>${esc(r.client_email)}</b>`:'Clientul nu are e-mail completat. Procesul-verbal se salvează doar în Drive.'}</span></label>
      <div class="sigs">${sigBlock('rsC','Predat de client')}${sigBlock('rsI','Primit de Inter Cargo')}</div></div>
    <button class="btn ok big block" id="rGo">Confirmă returul · drive test terminat</button>`,{back:()=>openDetail(id)});
  let rate='';
  $$('[data-rate]').forEach(b=>b.onclick=()=>{rate=b.dataset.rate;$$('[data-rate]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
  const pads={rsC:sigPad($('#rsC')),rsI:sigPad($('#rsI'))};
  $$('[data-clear]').forEach(b=>b.onclick=()=>pads[b.dataset.clear].clear());

    try{
      const f=Object.assign(collect($('#rf1')),collect($('#rf2')));

      const em=$('#rMail')?.checked; openDetail(id); openDoc(id,'pv',{autoSave:true,email:em});

function contractHTML(r,v,s,dd){
  const pf=r.client_tip==='PF', n=diffDays(r.dataStart,r.dataSfarsit)+1, ev=isEV(v);
  const pen=s.penalitate_zi||'300';
  const comodatar=pf
