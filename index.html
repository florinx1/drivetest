    : `<b>${B(r.client_denumire)}</b>, cu sediul în ${B(r.client_adresa)}, înregistrată la Registrul Comerțului sub nr. ${B(r.client_regcom)}, CUI ${B(r.client_cui)}, telefon ${B(r.client_telefon)}${r.client_email?', e-mail '+esc(r.client_email):''}, reprezentată legal prin ${B(r.client_reprezentant)}, în calitate de ${B(r.client_functie)}`;
  const drivers=[[r.sofer_nume,r.sofer_cnp,r.sofer_ci,r.sofer_permis,r.sofer_categorii,r.sofer_permisExp]].concat(r.sofer2_nume?[[r.sofer2_nume,'','',r.sofer2_permis,'','']]:[]);
  const fotos=(dd.fotos||[]).filter(f=>f.etapa==='predare');
  return `<div class="paper" id="paper">
  ${letterhead(s,v)}
  <h1>CONTRACT DE COMODAT</h1>
  <p class="sub">nr. <b>${B(r.nrContract)}</b> din data de <b>${fmt(r.predare_data)}</b><br>privind folosința gratuită a unui vehicul demonstrativ în scop de testare (drive test)</p>

  <h4>1. Părțile contractante</h4>
  <p>1.1. <b>${esc(s.firma_denumire||'INTER CARGO GRUP S.R.L.')}</b>, cu sediul în ${B(s.firma_sediu)}${s.firma_punct_lucru?', cu punct de lucru în '+esc(s.firma_punct_lucru):''}, înregistrată la Registrul Comerțului sub nr. ${B(s.firma_regcom)}, CUI ${B(s.firma_cui)}${s.firma_email?', e-mail '+esc(s.firma_email):''}, reprezentată legal prin ${B(s.firma_reprezentant)}, în calitate de ${B(s.firma_functie)}, denumită în continuare <b>„Comodantul”</b>,</p>
  <p>și</p>
  <p>1.2. ${comodatar}, denumit(ă) în continuare <b>„Comodatarul”</b>,</p>
  <p>au convenit încheierea prezentului contract de comodat, în temeiul art. 2146–2157 din Legea nr. 287/2009 privind Codul civil, republicată, cu respectarea următoarelor clauze.</p>

  <h4>2. Obiectul contractului</h4>
  <p>2.1. Comodantul remite Comodatarului, cu titlu gratuit și spre folosință temporară, vehiculul demonstrativ marca <b>${esc(v.marca)}</b>, model <b>${esc(v.model||v.denumire)}</b>, număr de identificare (VIN) ${B(v.vin)}, număr de înmatriculare ${B(v.nrInmatriculare)}, culoare ${B(v.culoare)}, an de fabricație ${B(v.anFabricatie)}, tip propulsie ${B(v.combustibil)}, denumit în continuare „Vehiculul”.</p>
  <p>2.2. Vehiculul este încredințat exclusiv în scopul testării (drive test), pentru ca Comodatarul să evalueze caracteristicile tehnice și de exploatare ale acestuia în vederea unei eventuale achiziții. Contractul nu creează pentru Comodatar nicio obligație de cumpărare.</p>
  <p>2.3. Vehiculul se predă împreună cu dotările, cheile și documentele consemnate în Procesul-verbal de predare-primire (Anexa 1) și în anexa foto, care fac parte integrantă din prezentul contract.</p>
  <p>2.4. Comodantul declară că are dreptul de a dispune de folosința Vehiculului. Comodatarul nu dobândește niciun drept de proprietate sau alt drept real asupra Vehiculului.</p>

  <h4>3. Durata contractului</h4>
  <p>3.1. Vehiculul se folosește în perioada <b>${fmt(r.dataStart)}</b>, ora ${B(r.predare_ora)} – <b>${fmt(r.dataSfarsit)}</b>, ora ${B(r.predare_oraRetur)}, respectiv ${zileTxt(n)} calendaristice.</p>
  <p>3.2. Perioada poate fi prelungită numai cu acordul prealabil, exprimat în scris, al Comodantului (inclusiv prin e-mail sau mesaj electronic confirmat).</p>
  <p>3.3. Comodatarul poate restitui Vehiculul oricând înainte de termen, cu informarea prealabilă a Comodantului.</p>
  <p>3.4. Comodantul poate solicita restituirea Vehiculului înainte de termen dacă Comodatarul își încalcă obligațiile sau dacă intervine pentru Comodant o nevoie urgentă și neprevăzută de Vehicul, caz în care Comodatarul are obligația de a-l restitui în cel mult 24 de ore de la solicitare.</p>

  <h4>4. Predarea și restituirea</h4>
  <p>4.1. Predarea Vehiculului se face la ${B(r.predare_loc)}, pe bază de proces-verbal în care se consemnează kilometrajul, nivelul de ${ev?'încărcare a bateriei':'combustibil'}, starea tehnică și estetică, dotările și documentele predate, însoțit de fotografii ale Vehiculului.</p>
  <p>4.2. La expirarea duratei, Comodatarul restituie Vehiculul la sediul Comodantului sau într-un alt loc convenit în scris, în starea în care l-a primit, cu excepția uzurii normale rezultate din folosința conformă, curat și cu un nivel de ${ev?'încărcare a bateriei':'combustibil'} cel puțin egal cu cel de la predare. În caz contrar, Comodatarul suportă contravaloarea ${ev?'energiei electrice':'combustibilului'} lipsă și a serviciilor de curățare, la tarifele practicate de Comodant.</p>
  <p>4.3. Restituirea se consemnează într-un proces-verbal de restituire (Anexa 2), însoțit de fotografii. Daunele și lipsurile constatate la restituire și neconsemnate în Anexa 1 ori în fotografiile de la predare se prezumă a fi produse în perioada de folosință a Comodatarului, până la proba contrară.</p>

  <h4>5. Obligațiile Comodantului</h4>
  <ol class="al" type="a">
    <li>să predea Vehiculul în stare bună de funcționare, cu inspecție tehnică periodică, poliță RCA și rovinietă valabile, precum și cu documentele necesare circulației pe drumurile publice;</li>
    <li>să informeze Comodatarul asupra caracteristicilor, modului de utilizare și particularităților Vehiculului${ev?', inclusiv asupra modului de încărcare a bateriei de tracțiune și a autonomiei estimate':''};</li>
    <li>să asigure asistență telefonică pe durata testului${s.telefon_asistenta?' la numărul <b>'+esc(s.telefon_asistenta)+'</b>':''};</li>
    <li>să suporte costurile de întreținere și reparații care nu sunt cauzate de folosința necorespunzătoare a Vehiculului.</li>
  </ol>

  <h4>6. Obligațiile Comodatarului</h4>
  <p>6.1. Comodatarul se obligă să folosească Vehiculul cu prudență și diligență, ca un bun proprietar, numai potrivit destinației sale și scopului prevăzut la art. 2.2.</p>
  <p>6.2. Vehiculul poate fi condus exclusiv de conducătorii auto nominalizați în Anexa 1, care dețin permis de conducere valabil pentru categoria Vehiculului. Comodatarul răspunde pentru faptele acestora ca pentru propriile fapte.</p>
  <p>6.3. Comodatarului îi este interzis:</p>
  <ol class="al" type="a">
    <li>să cedeze folosința Vehiculului unei terțe persoane, cu titlu gratuit sau oneros, ori să îl subînchirieze;</li>
    <li>să utilizeze Vehiculul pentru transport de persoane sau mărfuri contra cost, taxi, ride-sharing, închiriere sau școală de șoferi;</li>
    <li>să participe cu Vehiculul la competiții, teste de viteză, raliuri ori pe trasee care depășesc destinația și capacitatea tehnică a Vehiculului;</li>
    <li>să depășească masa maximă autorizată, sarcina utilă sau masa remorcabilă prevăzute în certificatul de înmatriculare;</li>
    <li>să conducă sau să permită conducerea Vehiculului sub influența alcoolului, a substanțelor psihoactive ori a medicamentelor care afectează capacitatea de conducere;</li>
    <li>să fumeze în Vehicul și să transporte substanțe periculoase, inflamabile sau care pot deteriora interiorul;</li>
    <li>să iasă cu Vehiculul de pe teritoriul României fără acordul prealabil scris al Comodantului;</li>
    <li>să modifice Vehiculul, să monteze sau să demonteze echipamente ori accesorii, să aplice inscripții sau colantări și să intervină asupra kilometrajului, software-ului sau sistemelor electronice ale Vehiculului.</li>
  </ol>
  <p>6.4. Comodatarul respectă legislația privind circulația pe drumurile publice (O.U.G. nr. 195/2002, republicată) și răspunde exclusiv pentru contravențiile, amenzile, tarifele de parcare, taxele de drum și de pod și orice alte sancțiuni aferente perioadei de folosință. Comodatarul este de acord ca, la solicitarea autorităților, Comodantul să comunice datele sale de identificare și ale conducătorului auto. Sumele eventual achitate de Comodant în acest sens se restituie de Comodatar în termen de 5 zile de la solicitare.</p>
  <p>6.5. Comodatarul asigură paza Vehiculului, îl parchează în locuri sigure, îl încuie ori de câte ori îl părăsește și nu lasă în Vehicul cheile, documentele sau obiecte de valoare.</p>
  <p>6.6. Comodatarul suportă costul ${ev?'energiei electrice consumate':'combustibilului consumat'}, verifică avertizările de la bord și, la apariția unei avertizări sau defecțiuni, oprește Vehiculul în siguranță și anunță de îndată Comodantul, fără a efectua reparații pe cont propriu.</p>
  ${ev?`<p>6.7. Vehiculul fiind electric, Comodatarul îl încarcă numai la stații sau prize compatibile, folosind cablul furnizat și respectând instrucțiunile producătorului, și evită descărcarea completă a bateriei de tracțiune.</p>`:''}
  <p>6.${ev?8:7}. În caz de accident, avarie, furt sau tentativă de furt, Comodatarul anunță de îndată autoritățile competente (112 / Poliția Română, după caz) și Comodantul, în cel mult 2 ore de la producerea evenimentului, întocmește documentele cerute de lege și de asigurător (constatare amiabilă sau documente eliberate de poliție) și nu recunoaște vinovăția și nu negociază cu terții fără acordul Comodantului.</p>

  <h4>7. Asigurare și răspundere</h4>
  <p>7.1. Vehiculul beneficiază de asigurare obligatorie RCA${v.casco==='Da'?' și de asigurare facultativă CASCO':''}, valabile pe durata contractului.</p>
  <p>7.2. Comodatarul răspunde pentru pieirea, pierderea sau deteriorarea Vehiculului, a dotărilor, cheilor și documentelor, produse din culpa sa, a conducătorilor auto nominalizați sau a persoanelor transportate. În condițiile Codului civil, Comodatarul răspunde și pentru pieirea fortuită a Vehiculului dacă l-a folosit contrar destinației, după expirarea termenului ori l-a încredințat altei persoane.</p>
  <p>7.3. ${v.casco==='Da'?`Pentru daunele acoperite de asigurarea CASCO, Comodatarul suportă franșiza prevăzută în polița de asigurare${s.franciza_casco?' (<b>'+esc(s.franciza_casco)+'</b>)':''}, precum și orice sumă pe care asigurătorul refuză să o plătească din cauza nerespectării de către Comodatar sau de către conducătorii auto a obligațiilor legale ori contractuale. `:''}Pentru daunele neacoperite de asigurare, Comodatarul suportă integral contravaloarea reparațiilor, a pieselor, a tractării și a expertizei, în limita valorii de piață a Vehiculului${v.valoareEUR?' (<b>'+esc(v.valoareEUR)+' EUR</b>)':''}.</p>
  <p>7.4. Comodantul nu răspunde pentru bunurile lăsate în Vehicul și nici pentru prejudiciile suferite de Comodatar sau de terți prin folosirea Vehiculului, cu excepția celor cauzate de viciile ascunse pe care Comodantul le cunoștea și despre care nu l-a informat pe Comodatar.</p>

  <h4>8. Întârzierea la restituire</h4>
  <p>8.1. Pentru nerestituirea Vehiculului la termen, fără acordul scris al Comodantului, Comodatarul datorează penalități de <b>${esc(pen)} lei pentru fiecare zi de întârziere</b>, cu titlu de clauză penală, fără ca aceasta să limiteze dreptul Comodantului la daune-interese pentru prejudiciul care depășește cuantumul penalităților.</p>
  <p>8.2. Dacă Vehiculul nu este restituit în termen de 48 de ore de la expirarea duratei, iar Comodatarul nu răspunde solicitărilor Comodantului, Comodantul poate sesiza organele de urmărire penală (art. 238 Cod penal – abuzul de încredere) și poate lua orice măsuri legale pentru recuperarea Vehiculului, pe cheltuiala Comodatarului.</p>

  <h4>9. Localizare, fotografii și date cu caracter personal</h4>
  <p>9.1. Comodatarul ia la cunoștință că Vehiculul poate fi echipat cu sisteme de telematică sau localizare GPS ale producătorului ori ale Comodantului, utilizate pentru protecția bunului, asistență tehnică și analiza funcționării.</p>
  <p>9.2. Comodantul prelucrează, în calitate de operator, datele cu caracter personal ale Comodatarului, ale reprezentanților și ale conducătorilor auto, precum și fotografiile Vehiculului și datele de localizare ale acestuia, în conformitate cu Regulamentul (UE) 2016/679 și cu Legea nr. 190/2018. Scopurile, temeiurile legale, destinatarii, durata de păstrare și drepturile persoanelor vizate sunt descrise în Nota de informare (Anexa 3), pe care Comodatarul declară că a primit-o și a citit-o. Comodatarul se obligă să aducă Nota de informare la cunoștința conducătorilor auto nominalizați.</p>
  <p>9.3. Acord pentru comunicări comerciale (opțional, revocabil oricând): <b>${r.predare_acordMarketing==='Da'?'DA':'NU'}</b>. Refuzul nu afectează încheierea sau executarea prezentului contract.</p>

  <h4>10. Încetarea contractului</h4>
  <p>10.1. Contractul încetează la expirarea duratei și restituirea Vehiculului, prin restituirea anticipată a Vehiculului sau prin acordul părților.</p>
  <p>10.2. În cazul încălcării de către Comodatar a oricăreia dintre obligațiile prevăzute la cap. 6, contractul este reziliat de drept, fără punere în întârziere și fără intervenția instanței, printr-o simplă notificare scrisă (inclusiv prin e-mail sau mesaj electronic), Comodatarul fiind obligat să restituie Vehiculul de îndată.</p>

  <h4>11. Forța majoră</h4>
  <p>11.1. Forța majoră, astfel cum este definită de art. 1351 Cod civil, exonerează de răspundere partea care o invocă, cu condiția notificării celeilalte părți în cel mult 24 de ore de la producerea evenimentului și a transmiterii documentelor doveditoare în cel mult 5 zile.</p>

  <h4>12. Litigii și legea aplicabilă</h4>
  <p>12.1. Contractul este guvernat de legea română. Litigiile se soluționează pe cale amiabilă, iar în caz contrar de instanțele judecătorești competente de la sediul Comodantului.</p>

  <h4>13. Dispoziții finale</h4>
  <p>13.1. Prezentul contract se completează cu dispozițiile Codului civil privind contractul de comodat. Orice modificare se face prin act adițional semnat de ambele părți, cu excepția prelungirii prevăzute la art. 3.2.</p>
  <p>13.2. Comodatarul declară că a citit și a înțeles contractul și că acceptă în mod expres, în sensul art. 1203 Cod civil, clauzele privind interdicțiile și răspunderea (cap. 6 și 7), penalitățile (cap. 8), rezilierea de drept (art. 10.2) și instanța competentă (art. 12.1).</p>
  <p>13.3. Părțile convin ca prezentul contract și anexele sale să poată fi semnate olograf pe suport electronic (tabletă sau telefon) și recunosc valabilitatea documentului astfel semnat și a copiei sale în format PDF, transmise Comodatarului pe e-mail. Contractul s-a încheiat astăzi, ${fmt(r.predare_data)}, în două exemplare, câte unul pentru fiecare parte.</p>

  <div class="sig-row avoid">
    <div class="sig-box"><b>COMODANT</b><span>${esc(s.firma_denumire||'INTER CARGO GRUP S.R.L.')}</span><span>prin ${B(r.predare_reprezentantICG)}</span><div class="ln">${sigImg(dd,'predare_icg')}</div></div>
    <div class="sig-box"><b>COMODATAR</b><span>${esc(r.client_denumire||'')}</span><span>prin ${B(r.predare_semnatarClient)}${!pf&&r.predare_calitateSemnatar?', '+esc(r.predare_calitateSemnatar):''}</span><div class="ln">${sigImg(dd,'predare_client')}</div></div>
  </div>

  <section class="pb">
  ${letterhead(s,v)}
  <h1 style="font-size:17px">ANEXA 1 – PROCES-VERBAL DE PREDARE-PRIMIRE</h1>
  <p class="sub">la Contractul de comodat nr. ${B(r.nrContract)} din ${fmt(r.predare_data)}</p>
  <table class="t avoid"><tbody>
    <tr><th>Vehicul</th><td>${esc(v.marca)} ${esc(v.model||v.denumire)} · VIN ${B(v.vin)} · ${B(v.nrInmatriculare)}</td></tr>
    <tr><th>Data și ora predării</th><td>${fmt(r.predare_data)}, ora ${B(r.predare_ora)}</td></tr>
    <tr><th>Locul predării</th><td>${B(r.predare_loc)}</td></tr>
    <tr><th>Termen de restituire</th><td>${fmt(r.dataSfarsit)}, ora ${B(r.predare_oraRetur)}</td></tr>
    <tr><th>Kilometraj la predare</th><td><b>${B(r.predare_km)} km</b></td></tr>
    <tr><th>${ev?'Nivel baterie':'Nivel combustibil'}</th><td>${B(r.predare_nivel)}</td></tr>
    <tr><th>Chei predate</th><td>${B(r.predare_chei)}</td></tr>
    <tr><th>Dotări predate</th><td>${B(r.predare_dotari)}${r.predare_dotariLipsa?'<br><i>Nu s-au predat: '+esc(r.predare_dotariLipsa)+'</i>':''}</td></tr>
    <tr><th>Documente predate</th><td>${B(r.predare_documente)}</td></tr>
    <tr><th>Stare, daune și observații existente</th><td>${B(r.predare_daune)}</td></tr>
    <tr><th>Fotografii</th><td>${fotos.length?fotos.length+' fotografii, în anexa foto':'—'}</td></tr>
  </tbody></table>
  <p><b>Conducători auto desemnați</b></p>
  <table class="t avoid"><thead><tr><th style="width:auto">Nume și prenume</th><th style="width:auto">CNP</th><th style="width:auto">C.I.</th><th style="width:auto">Permis nr.</th><th style="width:auto">Categorii</th><th style="width:auto">Valabil până la</th></tr></thead>
    <tbody>${drivers.map(d=>`<tr>${d.map((x,i)=>`<td>${i===5?fmt(x):esc(x||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>
  <p>Comodatarul confirmă că a primit Vehiculul în starea descrisă mai sus și în fotografiile anexate, că a fost instruit cu privire la utilizarea acestuia și că a primit dotările, cheile și documentele enumerate.</p>
  <div class="sig-row avoid">
    <div class="sig-box"><b>Am predat,</b><span>pentru Comodant: ${B(r.predare_reprezentantICG)}</span><div class="ln">${sigImg(dd,'predare_icg')}</div></div>
    <div class="sig-box"><b>Am primit,</b><span>pentru Comodatar: ${B(r.predare_semnatarClient)}</span><div class="ln">${sigImg(dd,'predare_client')}</div></div>
  </div></section>
  ${fotos.length?`<section class="pb">${letterhead(s,v)}<h1 style="font-size:17px">ANEXA FOTO – STAREA LA PREDARE</h1><p class="sub">Contract nr. ${B(r.nrContract)} · ${fmt(r.predare_data)}, ora ${B(r.predare_ora)} · ${B(r.predare_km)} km</p>
    <div class="pgrid">${fotos.map(f=>`<figure>${pimg(f)}<figcaption>${esc(f.slot)}</figcaption></figure>`).join('')}</div></section>`:''}
  ${gdprHTML(r,v,s)}
  <p class="foot">Document generat de aplicația ICG Drive Test · ${esc(r.nrContract||'')} · ID programare ${esc(r.id)}</p>
  </div>`;
}
function gdprHTML(r,v,s){
  const em=s.gdpr_email||s.firma_email||'office@fotonromania.com', pol=s.politica_url||'https://www.fotonromania.com/politica-de-confidentialitate/';
  return `<section class="pb">${letterhead(s,v)}<h1 style="font-size:17px">ANEXA 3 – NOTĂ DE INFORMARE PRIVIND PRELUCRAREA DATELOR CU CARACTER PERSONAL</h1>
  <p class="sub">în cadrul testării vehiculelor demonstrative (drive test) · Contract nr. ${B(r.nrContract)}</p>
  <h4>1. Cine prelucrează datele</h4>
  <p><b>${esc(s.firma_denumire||'INTER CARGO GRUP S.R.L.')}</b>, CUI ${B(s.firma_cui)}, nr. Registrul Comerțului ${B(s.firma_regcom)}, cu sediul în ${B(s.firma_sediu)}${s.firma_punct_lucru?' și punct de lucru în '+esc(s.firma_punct_lucru):''}, în calitate de operator. Contact pentru protecția datelor: <b>${esc(em)}</b>${s.firma_telefon?', telefon '+esc(s.firma_telefon):''}.</p>
  <h4>2. Ce date prelucrăm</h4>
  <ol class="al" type="a">
    <li>date de identificare și contact ale Comodatarului: nume sau denumire, CUI, nr. Registrul Comerțului, adresă, reprezentant, telefon, e-mail; pentru persoane fizice, CNP și seria și numărul actului de identitate;</li>
    <li>date ale conducătorilor auto: nume, CNP, seria și numărul actului de identitate, numărul, categoriile și valabilitatea permisului de conducere, telefon;</li>
    <li>date privind folosirea Vehiculului: data și ora predării și restituirii, kilometraj, nivel de combustibil sau baterie, starea Vehiculului, fotografii ale Vehiculului, date de localizare și funcționare transmise de sistemele telematice ale Vehiculului, dacă acesta este echipat;</li>
    <li>semnăturile olografe realizate pe suport electronic;</li>
    <li>opinia Comodatarului despre Vehicul și intenția de achiziție, dacă aceasta este exprimată;</li>
    <li>opțiunea privind comunicările comerciale.</li>
  </ol>
  <h4>3. De ce le prelucrăm și pe ce temei</h4>
  <ol class="al" type="a">
    <li>încheierea și executarea contractului de comodat, inclusiv predarea, restituirea și asistența pe durata testului: art. 6 alin. (1) lit. b) GDPR;</li>
    <li>îndeplinirea obligațiilor legale, inclusiv comunicarea identității conducătorului auto la solicitarea autorităților și obligațiile financiar-contabile: art. 6 alin. (1) lit. c) GDPR;</li>
    <li>protejarea Vehiculului, constatarea daunelor și a lipsurilor, recuperarea prejudiciilor și apărarea drepturilor în justiție (fotografii, date de localizare, păstrarea documentelor): interesul legitim al operatorului, art. 6 alin. (1) lit. f) GDPR;</li>
    <li>urmărirea interesului exprimat de Comodatar pentru achiziție și transmiterea ofertei solicitate: art. 6 alin. (1) lit. b) GDPR, ca demersuri precontractuale;</li>
    <li>transmiterea de oferte și informări comerciale, numai dacă ați bifat acordul: consimțământ, art. 6 alin. (1) lit. a) GDPR, pe care îl puteți retrage oricând.</li>
  </ol>
  <p>Codul numeric personal se prelucrează numai în măsura necesară identificării părții contractante și a conducătorului auto, cu respectarea garanțiilor prevăzute de art. 4 din Legea nr. 190/2018. Nu realizăm copii ale actelor de identitate și nu luăm decizii bazate exclusiv pe prelucrare automată.</p>
  <h4>4. Este obligatoriu să ne furnizați datele?</h4>
  <p>Datele de la pct. 2 lit. a)–d) sunt necesare pentru încheierea contractului. Fără ele, Vehiculul nu poate fi predat. Opinia despre Vehicul și acordul pentru comunicări comerciale sunt opționale.</p>
  <h4>5. Cui transmitem datele</h4>
  <p>Datele sunt accesibile doar personalului autorizat al operatorului, pe bază de cont individual. Pot fi transmise, strict în măsura necesară: furnizorilor de servicii IT și de stocare în cloud (Google, prin serviciile Google Workspace), care acționează ca persoane împuternicite; asigurătorilor RCA și CASCO în cazul unui eveniment; unităților service care intervin asupra Vehiculului; furnizorului sistemului telematic al Vehiculului, dacă este cazul; consultanților juridici și contabili; autorităților și instanțelor, la solicitarea acestora sau pentru apărarea drepturilor operatorului.</p>
  <h4>6. Transferuri în afara Spațiului Economic European</h4>
  <p>Unii furnizori de servicii cloud pot prelucra date în afara SEE. În aceste cazuri, transferul are loc numai pe baza unor garanții adecvate prevăzute de art. 44–49 GDPR, precum clauzele contractuale standard aprobate de Comisia Europeană.</p>
  <h4>7. Cât timp păstrăm datele</h4>
  <ol class="al" type="a">
    <li>contractul, procesele-verbale, fotografiile și semnăturile: pe durata contractului și 3 ani după restituirea Vehiculului (termenul general de prescripție), prelungit, dacă este cazul, până la soluționarea definitivă a unui litigiu sau a unei solicitări a autorităților; documentele cu valoare financiar-contabilă, pe durata prevăzută de legislația contabilă;</li>
    <li>datele de localizare: cel mult 90 de zile după restituire, cu excepția celor necesare pentru un incident;</li>
    <li>opinia despre Vehicul și intenția de achiziție: 3 ani de la ultima interacțiune;</li>
    <li>acordul pentru comunicări comerciale: până la retragerea acestuia.</li>
  </ol>
  <h4>8. Drepturile dumneavoastră</h4>
  <p>Aveți dreptul de acces, de rectificare, de ștergere, de restricționare a prelucrării, la portabilitatea datelor, de opoziție (inclusiv, oricând, față de comunicările comerciale) și de a vă retrage consimțământul, fără a afecta legalitatea prelucrării anterioare. Cererile se transmit la <b>${esc(em)}</b> sau în scris la sediul operatorului; vă răspundem în cel mult o lună. Aveți dreptul de a depune plângere la Autoritatea Națională de Supraveghere a Prelucrării Datelor cu Caracter Personal (www.dataprotection.ro).</p>
  <h4>9. Informații suplimentare</h4>
  <p>Prezenta notă completează Politica de confidențialitate disponibilă la ${esc(pol)}.</p>
  <p style="margin-top:10px">Am primit și am citit prezenta Notă de informare: <b>${r.predare_informareGDPR==='Da'?'DA':'—'}</b> · Comodatar: ${B(r.predare_semnatarClient)}</p>
  </section>`;
}

  </div>`;
}
function docName(r,kind){return (kind==='pv'?'PV-restituire-':'Contract-comodat-')+(r.nrContract||r.id)+'-'+(r.client_denumire||'client').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w\-]+/g,'_').slice(0,30)+'.pdf'}
async function openDoc(id,kind,opts={}){
  const r=S.db.rezervari.find(x=>x.id===id), v=veh(r.vehiculId);
  let dd={semnaturi:[],fotos:[]}; try{dd=await api('getDocData',{id},{msg:'Se pregătește documentul…'})}catch(e){toast('Semnăturile și pozele nu au putut fi încărcate: '+e.message,1)}
  const html=kind==='pv'?pvHTML(r,v,S.db.setari,dd):contractHTML(r,v,S.db.setari,dd);
  const name=docName(r,kind);
  const d=$('#doc');
  const saved=r[kind==='pv'?'pv_pdf':'contract_pdf'];
  d.innerHTML=`<div class="doc-bar"><div class="doc-bar-in"><button class="btn" id="docBack">‹ Înapoi</button><b>${kind==='pv'?'Proces-verbal de restituire':'Contract '+esc(r.nrContract||'')}</b><button class="btn primary" id="docPdf">Descarcă PDF</button><button class="btn" id="docShare">Trimite</button><button class="btn" id="docDrive">${saved?'Retrimite pe e-mail':'Salvează în Drive'}</button><button class="btn" id="docPrint">Printează</button></div><div class="doc-status" id="docStatus"></div></div><div class="doc-scroll">${html}</div>`;
  d.hidden=false; d.scrollTop=0;
  const status=$('#docStatus');
  const showSaved=(url,em)=>{status.innerHTML=`<span>✓ Salvat în Drive${url?` · <a href="${esc(url)}" target="_blank" rel="noopener">deschide</a>`:DEMO?' (simulat în demo)':''}</span>${em?`<span>✓ Trimis pe e-mail la ${esc(em)}${DEMO?' (simulat)':''}</span>`:''}`};
  if(saved) showSaved(saved==='demo'?'':saved,r[kind==='pv'?'pv_email':'contract_email']);
  $('#docBack').onclick=()=>{d.hidden=true;d.innerHTML='';if(!$('#sheet').hidden)openDetail(id)};
  $('#docPrint').onclick=()=>{try{window.print()}catch(e){toast('Printarea nu este disponibilă aici.',1)}};
  $('#docPdf').onclick=async()=>{try{const b=await makePdf();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}catch(e){toast('PDF-ul nu a putut fi generat: '+e.message,1)}};
  $('#docShare').onclick=async()=>{
    try{const b=await makePdf();const f=new File([b],name,{type:'application/pdf'});
      if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:name});
      else throw new Error('Trimiterea directă nu este suportată de acest browser. Folosește „Descarcă PDF”.');
    }catch(e){if(e.name!=='AbortError')toast(e.message,1)}
  };
  const saveDrive=async(email)=>{
    status.innerHTML='<span>Se generează PDF-ul și se salvează în Drive…</span>';
    try{
      const b=await makePdf(true); const b64=await blobToB64(b);
      const res=applyDb(await api('savePdf',{id,kind,filename:name,b64,email},{quiet:true}));
      showSaved(res&&res.url,res&&res.emailed);
      toast(res&&res.emailed?`Salvat în Drive și trimis la ${res.emailed}.`:'Salvat în Drive.');
    }catch(e){status.innerHTML=`<span style="color:#FFB4A8">Nu s-a putut salva: ${esc(e.message)}. Apasă „Salvează în Drive” pentru a reîncerca.</span>`}
  };
  $('#docDrive').onclick=()=>saveDrive(!!r.client_email);
  if(opts.autoSave) saveDrive(!!opts.email);
}
const blobToB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(b)});
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src)&&window.html2pdf)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('biblioteca PDF nu s-a încărcat (verifică internetul)'));document.head.appendChild(s)})}
async function makePdf(quiet){
  if(!quiet){$('#loaderTxt').textContent='Se generează PDF-ul…';$('#loader').hidden=false}
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    const host=document.createElement('div');host.className='pdf-host';const cl=$('#paper').cloneNode(true);cl.removeAttribute('id');cl.classList.add('pdfmode');host.appendChild(cl);document.body.appendChild(host);
    try{
      host.querySelectorAll('h4').forEach(h=>{const n=h.nextElementSibling;if(!n)return;const w=document.createElement('div');w.className='avoid';h.before(w);w.append(h,n)});
      await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
      return await window.html2pdf().set({margin:[12,13,14,13],image:{type:'jpeg',quality:0.92},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['.avoid','tr','p','li','h4','figure','.pcmp']}}).from(host.firstChild).outputPdf('blob');
    }finally{host.remove()}
  }finally{if(!quiet)$('#loader').hidden=true}
}

function bindAdmin(){
  const on=(sel,fn)=>{const e=$(sel);if(e)e.onclick=fn};
  $$('[data-atab]').forEach(b=>b.onclick=()=>{S.adminTab=b.dataset.atab;render()});
  const run=async(action,payload,msg)=>{try{applyDb(await api(action,payload));toast(msg);render()}catch(e){toast(e.message,1)}};
  on('#alSend',async()=>{try{const r=await api('testAlerte',{});toast(r.demo?`În demo nu se trimit e-mailuri (${r.count} alerte).`:r.sent?`Rezumat trimis la ${r.to}.`:r.to?'Nicio alertă de trimis azi.':'Completează mai întâi adresa în „Date firmă și e-mail”.',!r.sent&&!r.demo&&!r.to)}catch(e){toast(e.message,1)}});
  on('#blSave',()=>{try{const f=collect($('#blF'));f.vehiculIds=$$('.blV:checked').map(i=>i.value);if(!f.vehiculIds.length)throw new Error('Bifează cel puțin un vehicul.');run('saveBlocare',f,'Perioada a fost marcată ca ocupată.')}catch(e){toast(e.message,1)}});
  $$('[data-delbl]').forEach(b=>b.onclick=()=>run('deleteBlocare',{id:b.dataset.delbl},'Perioada a fost eliberată.'));
  on('#uSave',()=>{try{const f=collect($('#uF'));run('saveUtilizator',f,`Utilizator adăugat. PIN: ${f.pin}`)}catch(e){toast(e.message,1)}});
  $$('[data-delu]').forEach(b=>b.onclick=()=>run('deleteUtilizator',{id:b.dataset.delu},'Utilizator dezactivat.'));
  $$('[data-pinu]').forEach(b=>b.onclick=()=>{const id=b.dataset.pinu, box=$('#pinbox-'+id);
    box.innerHTML=`<div class="row" style="margin-top:8px"><input id="np-${id}" value="${randPin()}" inputmode="numeric" maxlength="8" class="search" style="max-width:140px;flex:none"><button class="btn primary sm" id="npok-${id}">Setează PIN-ul</button></div>`;
    on('#npok-'+id,()=>{const pin=$('#np-'+id).value.trim();const u=S.db.utilizatori.find(x=>x.id===id);run('saveUtilizator',{id,nume:u.nume,pin},`PIN nou pentru ${u.nume}: ${pin}`)})});
  $$('[data-savev]').forEach(b=>b.onclick=()=>{try{const f=collect($(`[data-veh="${b.dataset.savev}"]`));f.id=b.dataset.savev;run('saveVehicul',f,'Vehicul salvat.')}catch(e){toast(e.message,1)}});
  on('#sSave',()=>{try{run('saveSetari',collect($('#sF')),'Setări salvate.')}catch(e){toast(e.message,1)}});
}
